<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Visualiseur de Fichiers HD</title>
    <style>
        :root {
            --bg-color: #0b0d11;
            --alert-red: #ff0000;
            --matrix-green: #00ff41;
            --ios-blue: #007aff;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: white;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Effet CRT - Désactivé par défaut (opacity 0) */
        #crt-overlay {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10001;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0;
        }

        #app-container {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
            background: radial-gradient(circle, #1c1f26 0%, #0b0d11 100%);
            padding: 20px;
            transition: all 0.5s ease;
        }

        /* Image CLAIRE et PROPRE au départ */
        #trigger-img { 
            max-width: 95%; max-height: 55vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            object-fit: contain;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .real-link {
            background-color: var(--ios-blue);
            color: white; padding: 18px 35px;
            border-radius: 50px; font-weight: 600;
            font-size: 1.1rem; text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: transform 0.2s ease;
            text-align: center;
        }

        #scan, #terminal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; flex-direction: column; text-align: center;
        }
        
        #scan { 
            background-color: black; color: var(--matrix-green); 
            font-family: 'Courier New', monospace;
            justify-content: center; align-items: center; padding: 20px;
        }
        
        #terminal { 
            color: white;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Arial Black', sans-serif;
        }

        .emergency-header {
            background: white; color: red;
            width: 100%; font-size: 7vw; padding: 10px;
            font-weight: 900; position: absolute; top: 0; left: 0;
            z-index: 10000; border-bottom: 5px solid red;
        }

        .massive-text {
            font-size: 4.5vw;
            line-height: 1.3;
            text-transform: uppercase;
            margin: 10px 0;
            text-shadow: 3px 3px #ff0000;
        }

        .countdown { 
            font-size: 25vh; font-weight: 900;
            text-shadow: 8px 8px 0px #ff0000;
        }

        /* Classes d'animation activées par JS */
        .glitch-active { animation: glitch-skew 1s infinite linear alternate-reverse; }
        .shake-active { animation: flash-urgent 0.1s infinite, shake 0.08s infinite; }

        @keyframes glitch-skew {
            0% { transform: skew(3deg); }
            20% { transform: skew(-5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes flash-urgent {
            0%, 100% { background-color: #000; }
            50% { background-color: #400; }
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            100% { transform: translate(3px, -3px); }
        }

        @media (min-width: 1024px) {
            .massive-text { font-size: 2.5vw; }
            .emergency-header { font-size: 45px; }
        }

        .locked { touch-action: none; overflow: hidden; }
    </style>
</head>

    const dangerLines = document.getElementById("danger-lines");
    const crt = document.getElementById("crt-overlay");
    let audioCtx = null;

    const handleStart = (e) => {
        e.preventDefault();
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

    link.addEventListener('click', handleStart, false);

    function playAlertSound(freq, type="sawtooth", dur=0.2) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function startSimulation() {
        body.classList.add("locked");
        document.getElementById("app-container").style.display = "none";
        scan.style.display = "flex";

        const de = document.documentElement;
        if(de.requestFullscreen) de.requestFullscreen();

                d.style.fontSize = "1.5rem";
                d.style.marginBottom = "10px";
                d.textContent = lines[i];
                scan.appendChild(d);
                playAlertSound(700 + (i*150), "square");
                i++;
            } else {
                clearInterval(interval);
                setTimeout(launchRedAlert, 1500);

                d.textContent = m;
                dangerLines.appendChild(d);
                playAlertSound(150, "sawtooth", 0.4);

        display.className = "countdown glitch-active";
        terminal.appendChild(display);

        const cd = setInterval(() => {
            display.textContent = count;
            playAlertSound(60, "sawtooth", 0.6);

            if (count === 0) {
